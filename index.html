<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxP2P Nostr Web Client</title>
    <!-- Εισαγωγή βιβλιοθήκης nostr-tools -->
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .section { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #chat-box { height: 250px; border: 1px solid #ccc; border-radius: 4px; overflow-y: scroll; padding: 10px; background: #fafafa; margin-bottom: 15px; }
        .message { margin-bottom: 8px; padding: 6px; border-radius: 4px; }
        .incoming { background: #e2e3e5; text-align: left; }
        .outgoing { background: #d4edda; text-align: right; }
        .system { background: #fff3cd; color: #856404; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>MaxP2P Nostr Web Client</h2>
    
    <div class="section">
        <label for="relayUrl">Relay WebSocket URL:</label>
        <input type="text" id="relayUrl" value="wss://nos.lol">
    </div>

    <div class="section">
        <label for="myPrivKey">Το Private Key σου (Hex 64 chars ή nsec):</label>
        <input type="password" id="myPrivKey" placeholder="Εισάγετε το private key σας...">
    </div>

    <div class="section">
        <label for="peerPubKey">Διεύθυνση Παραλήπτη / Android App (Hex ή npub):</label>
        <input type="text" id="peerPubKey" placeholder="Το pubkey του κινητού...">
    </div>

    <button onclick="connectNostr()">Σύνδεση στα Relays</button>

    <hr style="margin: 20px 0;">

    <div class="section">
        <label>Ιστορικό Συνομιλίας:</label>
        <div id="chat-box"></div>
    </div>

    <div class="section">
        <textarea id="messageInput" placeholder="Γράψτε μήνυμα..." rows="3"></textarea>
    </div>
    
    <button onclick="sendMessage()">Αποστολή Μηνύματος</button>
</div>

<script>
    let ws = null;
    let myPubKeyHex = "";
    let myPrivKeyHex = "";

    // Αποκωδικοποίηση nsec/npub ή καθαρισμός Hex
    function resolveHexKey(inputKey) {
        if (!inputKey) return "";
        inputKey = inputKey.trim();
        if (inputKey.startsWith("npub1") || inputKey.startsWith("nsec1")) {
            try {
                let decoded = NostrTools.nip19.decode(inputKey);
                return decoded.data; // Επιστρέφει το καθαρό Hex
            } catch (e) {
                console.error("Σφάλμα αποκωδικοποίησης Bech32 key:", e);
            }
        }
        return inputKey.toLowerCase().replace(/^0x/, "");
    }

    function connectNostr() {
        const relayUrl = document.getElementById('relayUrl').value.trim();
        const rawPriv = document.getElementById('myPrivKey').value;
        myPrivKeyHex = resolveHexKey(rawPriv);

        if (!myPrivKeyHex || myPrivKeyHex.length !== 64) {
            alert("Παρακαλώ εισάγετε ένα έγκυρο Private Key (Hex 64 χαρακτήρων ή nsec)!");
            return;
        }

        try {
            // Αυτόματος υπολογισμός Public Key από το Private Key μέσω nostr-tools
            myPubKeyHex = NostrTools.getPublicKey(myPrivKeyHex);
        } catch (e) {
            alert("Αποτυχία παραγωγής Public Key από το Private Key!");
            return;
        }

        if (ws) {
            ws.close();
        }

        appendMessage("System", "Σύνδεση στο " + relayUrl + "...", "system");
        ws = new WebSocket(relayUrl);

        ws.onopen = function() {
            appendMessage("System", "Συνδέθηκε! Το PubKey σου είναι: " + myPubKeyHex.substring(0, 10) + "...", "system");
            
            // Αίτηση REQ filter για λήψη μηνυμάτων που έχουν target (#p) το PubKey μας
            const subRequest = JSON.stringify([
                "REQ",
                "maxp2p_sub",
                {
                    "kinds": [1, 4],
                    "#p": [myPubKeyHex]
                }
            ]);
            ws.send(subRequest);
        };

        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                
                // Επιβεβαίωση αποστολής από το Relay (OK response)
                if (data[0] === "OK") {
                    const isSuccess = data[2];
                    const reason = data[3];
                    if (isSuccess) {
                        console.log("✅ Το Relay αποδέχτηκε το μήνυμα!");
                    } else {
                        console.error("❌ Απορρίφθηκε από το relay:", reason);
                        appendMessage("System", "⚠️ Απορρίφθηκε: " + reason, "system");
                    }
                }

                // Λήψη εισερχόμενου EVENT
                if (data[0] === "EVENT") {
                    const ev = data[2];
                    appendMessage("Android App", ev.content, "incoming");
                }
            } catch (e) {
                console.error("Σφάλμα ανάγνωσης μηνύματος:", e);
            }
        };

        ws.onerror = function(error) {
            appendMessage("System", "Σφάλμα σύνδεσης WebSocket.", "system");
        };

        ws.onclose = function() {
            appendMessage("System", "Αποσυνδέθηκε από το relay.", "system");
        };
    }

    async function sendMessage() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert("Δεν έχετε συνδεθεί σε relay!");
            return;
        }

        const rawPeer = document.getElementById('peerPubKey').value;
        const peerHex = resolveHexKey(rawPeer);
        const messageText = document.getElementById('messageInput').value.trim();

        if (!peerHex || peerHex.length !== 64 || !messageText) {
            alert("Συμπληρώστε σωστά τη διεύθυνση παραλήπτη (64 chars) και το μήνυμα!");
            return;
        }

        const eventTemplate = {
            kind: 1,
            pubkey: myPubKeyHex,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["p", peerHex]],
            content: messageText
        };

        try {
            // Υπογραφή Event με το Private Key (BIP-340 Schnorr Compliant)
            const signedEvent = NostrTools.finishEvent(eventTemplate, myPrivKeyHex);

            // Αποστολή του πλήρους υπογεγραμμένου event στο Relay
            const msgPayload = JSON.stringify(["EVENT", signedEvent]);
            ws.send(msgPayload);

            appendMessage("Εσείς", messageText, "outgoing");
            document.getElementById('messageInput').value = "";
        } catch (e) {
            console.error("Σφάλμα υπογραφής/αποστολής:", e);
            alert("Σφάλμα κατά την υπογραφή του μηνύματος: " + e.message);
        }
    }

    function appendMessage(sender, text, type = "incoming") {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
