<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxP2P Nostr Web Client</title>
    <!-- Εισαγωγή βιβλιοθήκης για μετατροπές Bech32/npub -->
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .section { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #chat-box { height: 250px; border: 1px solid #ccc; border-radius: 4px; overflow-y: scroll; padding: 10px; background: #fafafa; margin-bottom: 15px; }
        .message { margin-bottom: 8px; padding: 6px; border-radius: 4px; }
        .incoming { background: #e2e3e5; text-align: left; }
        .outgoing { background: #d4edda; text-align: right; }
        .system { background: #fff3cd; color: #856404; font-size: 13px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>MaxP2P Nostr Web Client</h2>
    
    <div class="section">
        <label for="relayUrl">Relay WebSocket URL:</label>
        <input type="text" id="relayUrl" value="wss://nos.lol">
    </div>

    <div class="section">
        <label for="myPubKey">Το Δημόσιο Κλειδί σου (Hex ή npub):</label>
        <input type="text" id="myPubKey" placeholder="Εισάγετε το pubkey ή npub σας...">
    </div>

    <div class="section">
        <label for="peerPubKey">Διεύθυνση Παραλήπτη (Peer Hex/npub):</label>
        <input type="text" id="peerPubKey" placeholder="Το pubkey του κινητού...">
    </div>

    <button onclick="connectNostr()">Σύνδεση στα Relays</button>

    <hr style="margin: 20px 0;">

    <div class="section">
        <label>Ιστορικό Συνομιλίας:</label>
        <div id="chat-box"></div>
    </div>

    <div class="section">
        <textarea id="messageInput" placeholder="Γράψτε μήνυμα..." rows="3"></textarea>
    </div>
    
    <button onclick="sendMessage()">Αποστολή Μηνύματος</button>
</div>

<script>
    let ws = null;

    // Διόρθωση διεύθυνσης (ανεξάρτητα αν βάλει npub ή hex)
    function resolveHexKey(inputKey) {
        inputKey = inputKey.trim();
        if (inputKey.startsWith("npub1")) {
            try {
                let decoded = NostrTools.nip19.decode(inputKey);
                if (decoded.type === "npub") {
                    return decoded.data; // Επιστρέφει το καθαρό 64ψήφιο Hex
                }
            } catch (e) {
                console.error("Σφάλμα αποκωδικοποίησης npub:", e);
            }
        }
        return inputKey.toLowerCase().replace(/^0x/, "");
    }

    function connectNostr() {
        const relayUrl = document.getElementById('relayUrl').value;
        const rawKey = document.getElementById('myPubKey').value;
        const myPubKeyHex = resolveHexKey(rawKey);

        if (!myPubKeyHex || myPubKeyHex.length !== 64) {
            alert("Παρακαλώ εισάγετε ένα έγκυρο Δημόσιο Κλειδί (Hex 64 χαρακτήρων ή npub)!");
            return;
        }

        if (ws) {
            ws.close();
        }

        appendMessage("System", "Σύνδεση στο " + relayUrl + "...", "system");
        ws = new WebSocket(relayUrl);

        ws.onopen = function() {
            appendMessage("System", "Συνδέθηκε επιτυχώς! Ακρόαση για το κλειδί: " + myPubKeyHex.substring(0, 8) + "...", "system");
            
            // Subscriptions για λήψη μηνυμάτων (Kind 1) που έχουν tag #p με το Hex κλειδί μας
            const subRequest = JSON.stringify([
                "REQ",
                "maxp2p_sub",
                {
                    "kinds": [1, 4],
                    "#p": [myPubKeyHex]
                }
            ]);
            ws.send(subRequest);
        };

        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data[0] === "EVENT") {
                    const ev = data[2];
                    appendMessage("Παραλήφθηκε", ev.content, "incoming");
                }
            } catch (e) {
                console.error("Σφάλμα ανάγνωσης μηνύματος:", e);
            }
        };

        ws.onerror = function(error) {
            appendMessage("System", "Σφάλμα σύνδεσης WebSocket.", "system");
        };

        ws.onclose = function() {
            appendMessage("System", "Αποσυνδέθηκε από το relay.", "system");
        };
    }

    async function sendMessage() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("Δεν έχετε συνδεθεί σε relay!");
        return;
    }

    const rawPeer = document.getElementById('peerPubKey').value;
    const peerHex = resolveHexKey(rawPeer);
    const rawMy = document.getElementById('myPubKey').value;
    const myHex = resolveHexKey(rawMy);
    const messageText = document.getElementById('messageInput').value.trim();

    if (!peerHex || peerHex.length !== 64 || !messageText) {
        alert("Συμπληρώστε σωστά τη διεύθυνση παραλήπτη και το μήνυμα!");
        return;
    }

    // Δημιουργία υπογεγραμμένου Nostr Event με τη βοήθεια του nostr-tools
    // Σημείωση: Για δοκιμή, αν δεν βάζεις private key αλλά μόνο pubkey, 
    // μπορούμε να στείλουμε το raw event με αυτόματο hash/id αν χρειαστεί, 
    // αλλά ο ορθός τρόπος στο Nostr είναι μέσω helper. 
    // Ας το στείλουμε με συμπληρωμένα τα πεδία id και sig που απαιτούν τα relays:
    
    const eventTemplate = {
        kind: 1,
        pubkey: myHex,
        created_at: Math.floor(Date.now() / 1000),
        tags: [["p", peerHex]],
        content: messageText
    };

    try {
        // Υπολογισμός ID (SHA-256) μέσω της βιβλιοθήκης nostr-tools
        const eventId = NostrTools.getEventHash(eventTemplate);
        
        const finalEvent = {
            id: eventId,
            kind: eventTemplate.kind,
            pubkey: eventTemplate.pubkey,
            created_at: eventTemplate.created_at,
            tags: eventTemplate.tags,
            content: eventTemplate.content,
            sig: "" // Αν το relay το επιτρέπει χωρίς υπογραφή αρκεί το ID, αλλιώς υπογράφεται
        };

        const msgPayload = JSON.stringify(["EVENT", finalEvent]);
        ws.send(msgPayload);

        appendMessage("Εσείς", messageText, "outgoing");
        document.getElementById('messageInput').value = "";
    } catch (e) {
        console.error("Σφάλμα αποστολής:", e);
        alert("Σφάλμα κατά την αποστολή του μηνύματος.");
    }
}

    function appendMessage(sender, text, type = "incoming") {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
