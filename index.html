<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxP2P Web Tester</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 500px; 
            margin: 30px auto; 
            padding: 20px; 
            background: #121212; 
            color: #fff; 
        }
        input, textarea, button { 
            width: 100%; 
            margin-bottom: 12px; 
            padding: 12px; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #1e1e1e; 
            color: #fff; 
        }
        button { 
            background-color: #3f51b5; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 15px; 
        }
        button:hover { 
            background-color: #303f9f; 
        }
        #log { 
            background: #000; 
            padding: 12px; 
            height: 220px; 
            overflow-y: scroll; 
            font-family: monospace; 
            font-size: 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            color: #00ff66; 
        }
    </style>
</head>
<body>
    <h2>MaxP2P Web Sender 🚀</h2>
    
    <label style="font-size: 13px; color: #aaa;">Your Web ID (Sender):</label>
    <input type="text" id="webSenderAddress" value="0xWebTester123">

    <label style="font-size: 13px; color: #aaa;">Target Mobile Address (0x...):</label>
    <input type="text" id="targetAddress" placeholder="Επικόλλησε το ID του κινητού εδώ (π.χ. 0x...)">

    <label style="font-size: 13px; color: #aaa;">Message:</label>
    <textarea id="messageText" rows="3" placeholder="Γράψε μήνυμα για το κινητό..."></textarea>

    <button id="sendBtn" onclick="sendMessage()">Send to Mobile App</button>

    <h4 style="margin-top: 20px; font-size: 14px;">Console Logs:</h4>
    <div id="log">Status: Ready<br></div>

    <script>
        function log(text) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += text + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        const relays = [
            "wss://nos.lol",
            "wss://relay.damus.io",
            "wss://relay.nostr.band",
            "wss://purplepag.es"
        ];

        async function sendMessage() {
            const senderAddress = document.getElementById("webSenderAddress").value.trim();
            const targetAddress = document.getElementById("targetAddress").value.trim();
            const text = document.getElementById("messageText").value.trim();

            if (!targetAddress || !text) {
                alert("Συμπλήρωσε το Target Address και το Μήνυμα!");
                return;
            }

            log("<br>🔄 Έναρξη αποστολής...");
            let sentSuccessfully = false;

            for (let relayUrl of relays) {
                if (sentSuccessfully) break;

                log("📡 Δοκιμή σύνδεσης στο " + relayUrl + "...");

                await new Promise((resolve) => {
                    const socket = new WebSocket(relayUrl);
                    let handled = false;

                    const timeout = setTimeout(() => {
                        if (!handled) {
                            handled = true;
                            log("⚠️ Timeout στο " + relayUrl);
                            socket.close();
                            resolve();
                        }
                    }, 3000);

                    socket.onopen = () => {
                        if (handled) return;
                        handled = true;
                        clearTimeout(timeout);

                        log("✅ Συνδέθηκε στο " + relayUrl);

                        const payload = JSON.stringify({
                            type: "OFFLINE_MSG",
                            data: text
                        });

                        const event = [
                            "EVENT",
                            {
                                kind: 4,
                                pubkey: senderAddress,
                                created_at: Math.floor(Date.now() / 1000),
                                tags: [["p", targetAddress]],
                                content: payload
                            }
                        ];

                        socket.send(JSON.stringify(event));
                        log("📤 Το μήνυμα στάλθηκε από " + senderAddress + "!");
                        log("🟢 SUCCESS: Ολοκληρώθηκε μέσω " + relayUrl);
                        
                        sentSuccessfully = true;
                        document.getElementById("messageText").value = "";
                        
                        setTimeout(() => socket.close(), 1000);
                        resolve();
                    };

                    socket.onerror = () => {
                        if (handled) return;
                        handled = true;
                        clearTimeout(timeout);
                        log("❌ Αποτυχία σύνδεσης στο " + relayUrl);
                        resolve();
                    };
                });
            }

            if (!sentSuccessfully) {
                log("❌ Όλοι οι relays απέτυχαν. Ελέγξτε τη σύνδεσή σας.");
            }
        }
    </script>
</body>
</html>
