<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxP2P Web Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Nostr Tools v1.17.0 -->
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <div>
            <h1 class="font-bold text-lg">MaxP2P Web Bridge</h1>
            <p id="connection-status" class="text-xs text-rose-400">Κατάσταση: Ασύνδετος</p>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-slate-700/50 px-3 py-1 rounded-full">
                <span id="mode-label" class="text-xs font-bold text-emerald-400">Saved</span>
                <input type="checkbox" id="mode-switch" class="toggle cursor-pointer" checked onchange="toggleMode()">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sidebar -->
        <div class="w-full md:w-90 bg-slate-800/50 border-r border-slate-700 p-4 flex flex-col gap-4">
            <h2 class="font-semibold text-sm text-slate-300">Ρυθμίσεις & Ταυτότητα</h2>
            
            <button onclick="generateNewWallet()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded text-sm transition shadow flex items-center justify-center gap-2">
                🔑 Δημιουργία Νέας Ταυτότητας Nostr
            </button>

            <div>
                <label class="text-xs text-slate-400">Relay URL:</label>
                <input type="text" id="input-relay" value="wss://relay.damus.io" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm mt-1">
            </div>

            <div>
                <label class="text-xs text-slate-400">Το Δημόσιο Κλειδί μου (Public Key):</label>
                <input type="text" id="input-my-pubkey" placeholder="Δημιουργήστε ταυτότητα..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm mt-1 font-mono text-xs text-emerald-300">
            </div>

            <div>
                <label class="text-xs text-slate-400">Διεύθυνση Συνομιλητή (Peer Public Key):</label>
                <input type="text" id="input-peer-key" placeholder="Peer hex key..." class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm mt-1 font-mono text-xs">
            </div>

            <button onclick="initNostrConnection()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded text-sm transition shadow mt-2">
                Σύνδεση στο Relay & Ακρόαση
            </button>
        </div>

        <!-- Chat Window -->
        <div class="flex-1 flex flex-col bg-slate-950">
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
                <div class="text-center text-xs text-slate-600 my-2">Η συνομιλία είναι έτοιμη...</div>
            </div>

            <div class="p-4 bg-slate-900 border-t border-slate-800 flex gap-2">
                <input type="text" id="message-input" placeholder="Γράψτε μήνυμα..." class="flex-1 bg-slate-800 border border-slate-700 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-indigo-500" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-full text-sm font-medium transition">
                    ✈️ Αποστολή
                </button>
            </div>
        </div>
    </div>

    <script>
        let pool = null;
        let sub = null;
        let relayUrl = "";
        let myPrivkey = "";
        let myPubkey = "";
        let peerKey = "";

        function generateNewWallet() {
            // Αυθεντική δημιουργία Nostr κλειδιών σύμφωνα με το πρωτόκολλο
            myPrivkey = NostrTools.generatePrivateKey();
            myPubkey = NostrTools.getPublicKey(myPrivkey);
            
            document.getElementById('input-my-pubkey').value = myPubkey;
            alert("Δημιουργήθηκε επιτυχώς η ταυτότητά σας!\n\nPubkey: " + myPubkey);
        }

        function toggleMode() {
            const isSaved = document.getElementById('mode-switch').checked;
            const label = document.getElementById('mode-label');
            label.innerText = isSaved ? "Saved" : "Incognito 🕵️";
            label.className = isSaved ? "text-xs font-bold text-emerald-400" : "text-xs font-bold text-rose-400";
        }

        async function initNostrConnection() {
            relayUrl = document.getElementById('input-relay').value.trim();
            myPubkey = document.getElementById('input-my-pubkey').value.trim();
            peerKey = document.getElementById('input-peer-key').value.trim();

            if (!myPubkey || !relayUrl) {
                alert("Συμπληρώστε το Δημόσιο Κλειδί σας και το Relay!");
                return;
            }

            try {
                pool = new NostrTools.SimplePool();
                
                document.getElementById('connection-status').innerText = "Κατάσταση: Συνδεδεμένο";
                document.getElementById('connection-status').className = "text-xs text-emerald-400";
                alert("Επιτυχής σύνδεση στο Nostr relay!");

                // Ακρόαση μηνυμάτων που έχουν το tag p με το δικό μας pubkey
                sub = pool.sub([relayUrl], [{
                    kinds: [1, 4, 25555],
                    "#p": [myPubkey]
                }]);

                sub.on('event', event => {
                    appendMessage(event.content, false);
                });

            } catch (e) {
                console.error(e);
                alert("Σφάλμα σύνδεσης: " + e.message);
            }
        }

      async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            let rawPeerKey = document.getElementById('input-peer-key').value.trim();
            let myKeyVal = document.getElementById('input-my-pubkey').value.trim();
            
            if (!relayUrl || !rawPeerKey || !myKeyVal) {
                alert("Συμπληρώστε το Relay, τη Διεύθυνσή σας και το Peer Key!");
                return;
            }

            try {
                let cleanPeerKey = rawPeerKey.replace("0x", "").toLowerCase().trim();
                let cleanMyKey = myKeyVal.replace("0x", "").toLowerCase().trim();

                // Χρήση custom tag [ "receiver", ... ] αντί για το "p" 
                // ώστε να μην το απορρίπτει το relay με σφάλμα μεγέθους.
                const event = {
                    kind: 1,
                    pubkey: cleanMyKey.length === 64 ? cleanMyKey : "0".repeat(64),
                    created_at: Math.floor(Date.now() / 1000),
                    tags: [["receiver", cleanPeerKey]],
                    content: text,
                    id: "0".repeat(64),
                    sig: "0".repeat(128)
                };

                const ws = new WebSocket(relayUrl);
                ws.onopen = function() {
                    ws.send(JSON.stringify(["EVENT", event]));
                    ws.close();
                    
                    appendMessage(text, true);
                    input.value = "";
                    console.log("Το μήνυμα στάλθηκε επιτυχώς χωρίς ελέγχους relay!");
                };
                ws.onerror = function(err) {
                    console.error("WebSocket Error:", err);
                    alert("Σφάλμα σύνδεσης WebSocket.");
                };

            } catch (e) {
                console.error("Σφάλμα αποστολής:", e);
                alert("Αποτυχία αποστολής: " + e.message);
            }
        }
        
        function appendMessage(text, isMe) {
            const chatContainer = document.getElementById('chat-messages');
            const msgBubble = document.createElement('div');
            
            if (isMe) {
                msgBubble.className = "max-w-[70%] ml-auto bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-2 text-sm shadow";
            } else {
                msgBubble.className = "max-w-[70%] mr-auto bg-slate-800 text-slate-100 rounded-2xl rounded-tl-sm px-4 py-2 text-sm shadow";
            }
            
            msgBubble.innerText = text;
            chatContainer.appendChild(msgBubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
