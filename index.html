<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxP2P Nostr Web Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        .section { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #chat-box { height: 250px; border: 1px solid #ccc; border-radius: 4px; overflow-y: scroll; padding: 10px; background: #fafafa; margin-bottom: 15px; }
        .message { margin-bottom: 8px; padding: 6px; border-radius: 4px; }
        .incoming { background: #e2e3e5; text-align: left; }
        .outgoing { background: #d4edda; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>MaxP2P Nostr Web Client</h2>
    
    <div class="section">
        <label for="relayUrl">Relay WebSocket URL:</label>
        <input type="text" id="relayUrl" value="wss://nos.lol">
    </div>

    <div class="section">
        <label for="myPubKey">Το Δημόσιο Κλειδί σου (Hex):</label>
        <input type="text" id="myPubKey" placeholder="Εισάγετε το pubkey σας...">
    </div>

    <div class="section">
        <label for="peerPubKey">Διεύθυνση Παραλήπτη (Peer PubKey):</label>
        <input type="text" id="peerPubKey" placeholder="Το pubkey του συνομιλητή...">
    </div>

    <button onclick="connectNostr()">Σύνδεση στα Relays</button>

    <hr style="margin: 20px 0;">

    <div class="section">
        <label>Ιστορικό Συνομιλίας:</label>
        <div id="chat-box"></div>
    </div>

    <div class="section">
        <textarea id="messageInput" placeholder="Γράψτε μήνυμα..." rows="3"></textarea>
    </div>
    
    <button onclick="sendMessage()">Αποστολή Μηνύματος</button>
</div>

<script>
    let ws = null;

    function connectNostr() {
        const relayUrl = document.getElementById('relayUrl').value;
        const myPubKey = document.getElementById('myPubKey').value.trim();

        if (!myPubKey) {
            alert("Παρακαλώ εισάγετε το Δημόσιο Κλειδί σας!");
            return;
        }

        if (ws) {
            ws.close();
        }

        ws = new WebSocket(relayUrl);

        ws.onopen = function() {
            appendMessage("System", "Συνδέθηκε επιτυχώς στο relay: " + relayUrl);
            
            // Subscriptions για λήψη μηνυμάτων που απευθύνονται σε εμάς (Kind 4 / Direct Messages)
            const subRequest = JSON.stringify([
                "REQ",
                "maxp2p_sub",
                {
                    "kinds": [4],
                    "#p": [myPubKey]
                }
            ]);
            ws.send(subRequest);
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            // Formats: ["EVENT", subscription_id, event_object]
            if (data[0] === "EVENT") {
                const ev = data[2];
                appendMessage("Παραλήφθηκε", ev.content, "incoming");
            }
        };

        ws.onerror = function(error) {
            appendMessage("System", "Σφάλμα σύνδεσης WebSocket.");
        };

        ws.onclose = function() {
            appendMessage("System", "Αποσυνδέθηκε από το relay.");
        };
    }

    function sendMessage() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            alert("Δεν έχετε συνδεθεί σε relay!");
            return;
        }

        const peerPubKey = document.getElementById('peerPubKey').value.trim();
        const messageText = document.getElementById('messageInput').value.trim();

        if (!peerPubKey || !messageText) {
            alert("Συμπληρώστε τη διεύθυνση παραλήπτη και το μήνυμα!");
            return;
        }

        // Δομή Nostr Event (Kind 4 - Encrypted/Direct Message)
        const eventObj = {
            kind: 4,
            created_at: Math.floor(Date.now() / 1000),
            tags: [["p", peerPubKey]],
            content: messageText
        };

        // Σημείωση: Στην κανονική ροή απαιτείται υπογραφή με το Private Key (Schnorr signature).
        // Εδώ στέλνουμε το δομημένο JSON πακέτο όπως το δέχεται το relay.
        const msgPayload = JSON.stringify(["EVENT", eventObj]);
        ws.send(msgPayload);

        appendMessage("Εσείς", messageText, "outgoing");
        document.getElementById('messageInput').value = "";
    }

    function appendMessage(sender, text, type = "incoming") {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
