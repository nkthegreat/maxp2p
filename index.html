<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxP2P Web Tester</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; background: #121212; color: #fff; }
        input, textarea, button { width: 100%; margin-bottom: 12px; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; }
        button { background-color: #3f51b5; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background-color: #303f9f; }
        #log { background: #000; padding: 12px; height: 220px; overflow-y: scroll; font-family: monospace; font-size: 12px; border-radius: 8px; border: 1px solid #333; color: #00ff66; }
    </style>
</head>
<body>
    <h2>MaxP2P Web Sender 🚀</h2>
    
    <label style="font-size: 13px; color: #aaa;">Target Mobile Address (0x...):</label>
    <input type="text" id="targetAddress" placeholder="Επικόλλησε το ID του κινητού εδώ">

    <label style="font-size: 13px; color: #aaa;">Message:</label>
    <textarea id="messageText" rows="3" placeholder="Γράψε μήνυμα για το κινητό..."></textarea>

    <button id="sendBtn" onclick="sendMessage()">Send to Mobile App</button>

    <h4 style="margin-top: 20px; font-size: 14px;">Console Logs:</h4>
    <div id="log">Status: Ready<br></div>

    <script>
        function log(text) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += text + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function sendMessage() {
            const targetAddress = document.getElementById("targetAddress").value.trim();
            const text = document.getElementById("messageText").value.trim();

            if (!targetAddress || !text) {
                alert("Συμπλήρωσε το Target Address και το Μήνυμα!");
                return;
            }

            log("<br>🔄 Έναρξη αποστολής...");
            log("📡 Σύνδεση στο wss://relay.damus.io...");

            const socket = new WebSocket("wss://relay.damus.io");

            socket.onopen = () => {
                log("✅ Συνδέθηκε στον Nostr Relay!");

                // Δημιουργία Payload για το Android App
                const payload = JSON.stringify({
                    type: "OFFLINE_MSG",
                    data: text
                });

                // Παραγωγή τυχαίου pubkey 64 χαρακτήρων για τον Web Tester
                const senderPubkey = Array.from({length: 64}, () => Math.floor(Math.random() * 16).toString(16)).join('');

                const event = [
                    "EVENT",
                    {
                        kind: 4,
                        pubkey: senderPubkey,
                        created_at: Math.floor(Date.now() / 1000),
                        tags: [["p", targetAddress]],
                        content: payload
                    }
                ];

                socket.send(JSON.stringify(event));
                log("📤 Το μήνυμα στάλθηκε στον Relay για το ID: " + targetAddress);
                log("🟢 SUCCESS: Ολοκληρώθηκε!");
                
                document.getElementById("messageText").value = "";
                setTimeout(() => socket.close(), 1000);
            };

            socket.onerror = (err) => {
                log("❌ Σφάλμα σύνδεσης με τον Relay. Ελέγξτε αν έχετε ad-blocker.");
            };

            socket.onclose = () => {
                log("🔌 Η σύνδεση έκλεισε.");
            };
        }
    </script>
</body>
</html>
